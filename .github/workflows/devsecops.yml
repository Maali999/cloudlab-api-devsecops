
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-sonar:
    name: Build, Test, Scan and Push to ECR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout source code
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Build project and run unit tests
      - name: Build and run unit tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean verify

      # 4. Authenticate with SonarQube Cloud
      - name: Authenticate with SonarQube Cloud
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@bba0c5629afd26ab56e4e3b84d8c7639d24073e0 # v1.0.1
        with:
          export-env: false

      # 5. Run SonarQube analysis and check Quality Gate
      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=${{ steps.sonar-auth.outputs.organization }} \
            -Dsonar.projectKey=${{ steps.sonar-auth.outputs.project-key }} \
            -Dsonar.qualitygate.wait=true

      # 6. Build Docker image using Git commit SHA
      - name: Build Docker image
        run: |
          docker build -t cloudlab-api:${{ github.sha }} .

      # 7. Scan Docker image using Trivy
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: cloudlab-api:${{ github.sha }}
          format: table
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # 8. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      # 9. Login to Amazon ECR
      - name: Login to Amazon ECR
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin \
            "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      # 10. Push Docker image to Amazon ECR
      - name: Push Docker image to Amazon ECR
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

          docker tag "cloudlab-api:${{ github.sha }}" "$IMAGE_URI:${{ github.sha }}"

          docker push "$IMAGE_URI:${{ github.sha }}"
