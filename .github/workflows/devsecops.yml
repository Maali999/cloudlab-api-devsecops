
name: DevSecOps Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-sonar:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and run unit tests
        run: |
          chmod +x ./mvnw
          ./mvnw -B clean verify

      - name: Authenticate with SonarQube Cloud
        id: sonar-auth
        uses: SonarSource/sonarqube-auth-action@bba0c5629afd26ab56e4e3b84d8c7639d24073e0 # v1.0.1
        with:
          export-env: false

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ steps.sonar-auth.outputs.sonar-token }}
        run: |
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=${{ steps.sonar-auth.outputs.organization }} \
            -Dsonar.projectKey=${{ steps.sonar-auth.outputs.project-key }} \
            -Dsonar.qualitygate.wait=true
